<svg width="300" height="200" xmlns="http://www.w3.org/2000/svg">

  <!-- Define a group of elements with an id -->
  <g id="house">
    <!-- Base of the house -->
    <rect x="0" y="50" width="100" height="50" fill="tan" stroke="brown" stroke-width="2"/>
    <!-- Roof of the house -->
    <polygon points="0,50 50,0 100,50" fill="maroon" stroke="brown" stroke-width="2"/>
    <!-- Door -->
    <rect x="45" y="70" width="10" height="30" fill="sienna"/>
  </g>

  <!-- Reuse the group in different positions and transformations -->
  <!-- Original house -->
  <use href="#house" x="0" y="0"/>

  <!-- Scaled house -->
  <use href="#house" x="120" y="0" transform="scale(1.5)" />

  <!-- Rotated house -->
  <use href="#house" x="0" y="100" transform="rotate(15 50 75)" />

  <!-- Skewed house -->
  <use href="#house" x="150" y="100" transform="skewX(20)" />

</svg>
